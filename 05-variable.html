<!DOCTYPE html>
<html>
  <head>
    <title>
      Variables
    </title>
    <style>
    
    </style>
  </head>
  <body>



      <script>
        let variable1 = 3;
        console.log(variable1);
        let calculation = 2+2;
        console.log(calculation);
        console.log(calculation + 2);

        let result = calculation + 2;
        console.log(result);

        let message = 'hello';
        console.log(message);

        variable1 = 5;
        console.log(variable1);

        variable1 = variable1 + 1;
        console.log(variable1);

        const variable2 = 10;//value cannot be changed
        console.log(variable2);

        var variable3 = 20;// var is an older way to declare variables, it is not recommended to use it anymore
        console.log(variable3);

        console.log(typeof message);
      </script>
  </body>
</html>
